tmux:
    symbols:
        branch: 'git:'
        hashprefix: ':'
        ahead: ↑·
        behind: ↓·
        staged: '● '
        conflict: '✖ '
        modified: '✚ '
        untracked: '… '
        stashed: '⚑ '
        clean: ✔
    styles:
        clear: '#[default]'
        state: '#[fg=#FF8D87,bold]'
        branch: '#[fg=#6AE8B7]'
        remote: '#[fg=#86EBF7]'
        staged: '#[fg=#6AE8B7]'
        conflict: '#[fg=#FF8D87,bold]'
        modified: '#[fg=#F2C785]'
        untracked: '#[fg=#A9BBC6]'
        stashed: '#[fg=#C6ADFF]'
        clean: '#[fg=#6AE8B7]'
        divergence: '#[fg=#86EBF7]'
    layout: ['#[fg=#708A97] │ ', branch, divergence, ' ', flags]
    options:
        branch_max_len: 22
        branch_trim: right
